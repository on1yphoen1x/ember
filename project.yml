name: Ember
options:
  bundleIdPrefix: app.phoenixclips
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Ember:
    type: application
    platform: macOS
    sources:
      - Ember
    settings:
      base:
        PRODUCT_NAME: Ember
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: app.phoenixclips.Ember
    info:
      path: Ember/Info.plist
      properties:
        CFBundleDisplayName: Ember
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        LSUIElement: true
        NSAppleEventsUsageDescription: Ember reads the current song from Music and Spotify so it can show it in the notch and control playback.
    entitlements:
      path: Ember/Ember.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.network.client: true
        com.apple.security.automation.apple-events: true
